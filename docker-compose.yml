name: acme-credit

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: acme
    ports:
      # 5442 on the host, to avoid other local Postgres containers.
      - "5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d acme"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["node", "dist/platform/db/migrate-cli.js"]
    environment:
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@db:5432/acme
      APP_DB_PASSWORD: acme_app_local
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    env_file: .env.example
    environment:
      DATABASE_URL: postgres://acme_app:acme_app_local@db:5432/acme
    ports:
      # 3080 on the host, to avoid other local dev servers on 3000.
      - "3080:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
